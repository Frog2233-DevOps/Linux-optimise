#cloud-config
package_update: true
packages: [curl, ca-certificates]
ssh_pwauth: false
disable_root: false
runcmd:
  - curl -fsSL --proto '=https' --proto-redir '=https' -o /root/bootstrap.sh https://raw.githubusercontent.com/Frog2233-DevOps/Linux-optimise/main/bootstrap.sh
  - bash /root/bootstrap.sh apply --yes --github Frog2233-DevOps
