name: nightly
on:
  schedule: [{ cron: "17 2 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix: { base: ["ubuntu:24.04", "ubuntu:26.04"] }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: BASE=${{ matrix.base }} bash tests/run-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: nightly-log, path: tests/out/, if-no-files-found: ignore }
