name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - run: shellcheck --version && shfmt --version
      - run: shellcheck bootstrap.sh tests/*.bash tests/*.sh
      - run: shfmt -d -i 2 -ci bootstrap.sh tests/
      - uses: raven-actions/actionlint@v2
      - run: bash -n bootstrap.sh
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/unit
  smoke:
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: smoke-log, path: tests/out/, if-no-files-found: ignore }
