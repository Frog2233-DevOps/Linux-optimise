name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shfmt (version pinned to match local)
        env:
          SHFMT_VERSION: v3.14.1
        run: |
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt
      - run: shellcheck --version && shfmt --version
      - run: shellcheck bootstrap.sh tests/*.bash tests/*.sh
      - run: shfmt -d -i 2 -ci bootstrap.sh tests/
      - uses: raven-actions/actionlint@v2
      - run: bash -n bootstrap.sh
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/unit
  smoke:
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-log, path: tests/out/, if-no-files-found: ignore }
